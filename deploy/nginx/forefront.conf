# Reference Nginx server block for forefrontsolutions.co.ke on the VPS.
# Compare against whatever's already live at /etc/nginx/sites-available/ —
# this is a starting point, not guaranteed to match the current config.
# Adjust: server_name, ssl_certificate paths, php-fpm socket path, PHP version.

server {
    listen 80;
    listen [::]:80;
    server_name forefrontsolutions.co.ke www.forefrontsolutions.co.ke;
    return 301 https://forefrontsolutions.co.ke$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.forefrontsolutions.co.ke;

    ssl_certificate     /etc/letsencrypt/live/forefrontsolutions.co.ke/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/forefrontsolutions.co.ke/privkey.pem;

    return 301 https://forefrontsolutions.co.ke$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name forefrontsolutions.co.ke;

    root /var/www/forefront/public;
    index index.php;

    ssl_certificate     /etc/letsencrypt/live/forefrontsolutions.co.ke/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/forefrontsolutions.co.ke/privkey.pem;

    client_max_body_size 20m;

    charset utf-8;

    # Deny hidden files (.env, .git, etc.)
    location ~ /\. {
        deny all;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # Static assets: long cache
    location ~* \.(css|js|mjs|png|jpg|jpeg|gif|svg|webp|avif|woff|woff2|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /sitemap.xml {
        add_header Cache-Control "public, max-age=3600";
        try_files $uri /index.php?$query_string;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.3-fpm.sock; # adjust PHP version/socket path
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    access_log /var/log/nginx/forefront-access.log;
    error_log  /var/log/nginx/forefront-error.log;
}
