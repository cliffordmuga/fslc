# Nginx site config for forefrontsolutions.co.ke — mirrors the actual live
# config at /etc/nginx/sites-available/forefront on the VPS. Keep these in
# sync: if you edit one, edit the other (there's no automated deploy step
# that applies this file server-side).
#
# Changed from the original Certbot-generated file (2026-09-23):
#   - Removed `add_header X-Frame-Options "SAMEORIGIN"` and
#     `add_header X-Content-Type-Options "nosniff"` — these duplicated (and
#     for X-Frame-Options, conflicted with) what Laravel's SecurityHeaders
#     middleware already sends (DENY vs SAMEORIGIN). Two servers disagreeing
#     on the same header is undefined behavior across browsers; Laravel is
#     now the single source of truth for these.
#   - Added gzip_types — CSS/JS/SVG/JSON were being served fully
#     uncompressed (only text/html was covered by Ubuntu's default nginx.conf
#     gzip config), a real page-weight/performance issue.
#   - Split off a dedicated www server block that 301s straight to the apex
#     domain (single hop from any entry point), since APP_URL and every
#     canonical/OG tag in the app use the no-www apex — serving identical
#     content at both hostnames with no redirect was a duplicate-content SEO
#     issue.

server {
    server_name forefrontsolutions.co.ke;

    root /var/www/forefront/public;
    index index.php;
    charset utf-8;

    client_max_body_size 20M;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss application/atom+xml image/svg+xml font/woff font/woff2;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }
    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }
    error_page 404 /index.php;

    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.3-fpm-forefront.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 300;
    }
    location ~ /\.(?!well-known).* { deny all; }
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/forefrontsolutions.co.ke/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/forefrontsolutions.co.ke/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

# www over HTTPS -> apex over HTTPS (single hop; the HTTP-> HTTPS block below
# sends www straight here too, so this only catches direct/cached HTTPS hits)
server {
    listen [::]:443 ssl;
    listen 443 ssl;
    server_name www.forefrontsolutions.co.ke;

    ssl_certificate /etc/letsencrypt/live/forefrontsolutions.co.ke/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/forefrontsolutions.co.ke/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://forefrontsolutions.co.ke$request_uri;
}

server {
    if ($host = www.forefrontsolutions.co.ke) {
        return 301 https://forefrontsolutions.co.ke$request_uri;
    }

    if ($host = forefrontsolutions.co.ke) {
        return 301 https://$host$request_uri;
    }

    listen 80;
    listen [::]:80;
    server_name forefrontsolutions.co.ke www.forefrontsolutions.co.ke;
    return 404; # managed by Certbot
}
