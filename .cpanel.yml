---
# cPanel "Git Version Control" deploy script.
#
# Setup (one-time, in cPanel — see DEPLOYMENT.md "Git-based deploys" for the
# full walkthrough):
#   1. cPanel → Git Version Control → Create.
#      Repository Path: /home/pwdfvylw/sitefolder/forefront   (the Laravel
#      root — NOT public_html/). Must be created fresh/empty; git clone
#      refuses a non-empty target, which is why this isn't sitefolder/fslc
#      (that path already held the old hand-uploaded deployment).
#      Clone URL: https://github.com/cliffordmuga/fslc.git, branch: main.
#   2. .env stays hand-managed on the server (it's gitignored — a `git pull`
#      here never touches it, same for storage/, vendor/, node_modules/).
#   3. After the FIRST clone only: copy .env.example -> .env, fill in
#      production values, `php artisan key:generate`, `php artisan migrate`,
#      `php artisan storage:link`. Routine deploys after that just need step 4.
#   4. Every deploy: cPanel → Git Version Control → your repo → "Manage" ->
#      pull latest, then "Deploy HEAD Commit". That runs the tasks below.
#
# Each task is a plain shell command run with the repo checkout as the
# working directory — NOT a full CI environment (no conditionals). Update
# DEPLOYPATH and the PHP binary path for your account before first deploy
# (cPanel → MultiPHP Manager shows the exact ea-phpXX path; `which composer`
# in cPanel Terminal shows the composer path if it isn't on PATH already).
#
# This intentionally does NOT touch: .env, storage/ (uploads, logs, the
# sessions/cache DB tables live in MySQL, not here), public_html/uploads/,
# or the public_html/storage symlink. Only files tracked in this repo move.
#
# IMPORTANT — public/build/ (compiled CSS/JS) is COMMITTED to this repo, not
# gitignored. This host has no guaranteed Node/npm, and "Deploy HEAD Commit"
# does a clean checkout that wipes any untracked file in the repo path
# (including gitignored ones) — a manually-placed public/build/ was getting
# silently deleted on every deploy, breaking the live site twice
# (ViteManifestNotFoundException). Before any commit that changes
# resources/{css,js}: run `npm run build` locally and commit the resulting
# public/build/ so it survives the clean checkout and travels with the repo
# automatically. The rsync below deliberately has NO --delete (a destructive
# mirror that once wiped production assets when the source was briefly
# empty) — an empty or stale source is now a no-op instead.
#
# IMPORTANT — public/.htaccess is only copied to $DEPLOYPATH when no
# .htaccess exists there yet. public_html/.htaccess carries the
# server-specific `SetEnv APP_LARAVEL_PATH ...` line added by hand after the
# first deploy (see step 3 below); the committed public/.htaccess never has
# that line, so an unconditional `cp -f` on every deploy was clobbering it
# and breaking the live site (PHP can't find vendor/autoload.php -> 500). If
# public/.htaccess changes and you need the new version live, copy it up
# manually and re-add the SetEnv line — don't remove the `test -f` guard.
deployment:
  tasks:
    - export DEPLOYPATH=/home/pwdfvylw/public_html/
    - /bin/cp -f public/index.php $DEPLOYPATH
    - test -f $DEPLOYPATH/.htaccess || /bin/cp -f public/.htaccess $DEPLOYPATH
    - /bin/cp -f public/favicon.ico $DEPLOYPATH 2>/dev/null || true
    - /bin/cp -f public/robots.txt $DEPLOYPATH 2>/dev/null || true
    - /bin/rsync -a public/build/ $DEPLOYPATH/build/
    - /bin/rsync -a public/images/ $DEPLOYPATH/images/
    - /bin/rsync -a public/plugins/ $DEPLOYPATH/plugins/
    - composer install --no-dev --optimize-autoloader --no-interaction
    - php artisan migrate --force
    - php artisan config:cache
    - php artisan route:cache
    - php artisan view:cache
    - php artisan event:cache
    - php artisan sitemap:generate
